# ==========================================
# HYPERCUBE 300 V2
# BIGTREETECH SKR MINI E3 V3.0 (STM32G0B1)
# NixOS / Klipper / Moonraker / Mainsail
#
# Deploy with: sudo ./klipper-deploy.sh   (keeps the printer's SAVE_CONFIG block)
# Macros live in macros.cfg.
# ==========================================

[include macros.cfg]

[mcu]
serial: /dev/klipper-mcu          # udev alias from module.nix

# Motion limits tuned to keep the frame from shaking. Acceleration and
# corner speed, not top speed, are what jolt the machine. SMOOTH_MODE /
# NORMAL_MODE (macros.cfg) switch at runtime. Raise max_accel again only
# after input shaper tuning.
[printer]
kinematics: corexy
max_velocity: 200
max_accel: 1500                   # was 2000
minimum_cruise_ratio: 0.5         # short moves accelerate less hard
max_z_velocity: 15                # TR8x8 lead screws handle this easily
max_z_accel: 150
square_corner_velocity: 4         # was 5: softer direction changes


# ==========================================
# X AXIS — SENSORLESS HOMING
# Homing current is lowered in [homing_override] (macros.cfg),
# so driver_SGTHRS stays tuned at 0.45 A.
# ==========================================

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 310
homing_speed: 40                  # stops early: lower driver_SGTHRS; hits hard: raise it
homing_retract_dist: 0            # required for sensorless homing

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.800                # printing current; homing uses 0.45
diag_pin: ^PC0
driver_SGTHRS: 80


# ==========================================
# Y AXIS — SENSORLESS HOMING
# ==========================================

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -15
position_min: -15
position_max: 310
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.800
diag_pin: ^PC1
driver_SGTHRS: 80


# ==========================================
# Z AXIS — TWO MOTORS ON ONE DRIVER, TR8x8 LEAD SCREWS
# ==========================================

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8              # TR8x8 lead = 8 mm/rev (was 7.901235)
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 300
homing_speed: 10                  # fast approach to the probe
second_homing_speed: 2            # slow, accurate second touch

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 1.0


# ==========================================
# M12 INDUCTIVE Z PROBE (HSM12-10)
# Measured 40 mm left of the nozzle on the current carrier.
# If you fit the v5 carrier, re-measure: about -26.5 mm.
# z_offset is stored in the SAVE_CONFIG block below.
# ==========================================

[probe]
pin: ^!PC14
x_offset: -40
y_offset: 0
speed: 5
lift_speed: 15
samples: 3
samples_result: median
sample_retract_dist: 1
samples_tolerance: 0.02
samples_tolerance_retries: 3


# ==========================================
# BED MESH
# START_PRINT probes an adaptive mesh over the printed area only.
# Probe reach with x_offset -40: nozzle 55..310 -> probe 15..270.
# ==========================================

[bed_mesh]
speed: 200                        # = max_velocity
horizontal_move_z: 3
mesh_min: 15, 15
mesh_max: 265, 295
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10
adaptive_margin: 5

# Bed tramming helper. Fill in the bed screw positions (nozzle
# coordinates that put the PROBE over each screw), then run
# SCREWS_TILT_CALCULATE. Your current mesh spans about 1 mm, mostly
# along X, so the bed should be levelled by hand first.
#[screws_tilt_adjust]
#screw1: 0, 0
#screw1_name: front left
#screw2: 0, 0
#screw2_name: front right
#screw3: 0, 0
#screw3_name: rear right
#screw4: 0, 0
#screw4_name: rear left
#horizontal_move_z: 10
#speed: 100
#screw_thread: CW-M4


# ==========================================
# BOWDEN EXTRUDER + VOLCANO (all-metal heatbreak)
# ==========================================

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 23.188406
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PA0
control: pid                      # re-run: PID_CALIBRATE HEATER=extruder TARGET=240
pid_Kp: 25.299
pid_Ki: 1.576
pid_Kd: 101.511
min_temp: 0
max_temp: 300                     # all-metal heatbreak
max_extrude_only_distance: 100    # long Bowden load/unload
pressure_advance: 0.0             # TODO: tune; Bowden is usually 0.3-0.8
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.450


# ==========================================
# HEATED BED
# Run PID_CALIBRATE HEATER=heater_bed TARGET=65, then SAVE_CONFIG:
# it switches the bed to PID control in the block below.
# ==========================================

[heater_bed]
heater_pin: PC9
sensor_type: Generic 3950
sensor_pin: PC4
control: watermark
min_temp: 0
max_temp: 110


# ==========================================
# FANS
# ==========================================

# FAN0 — part cooling
[fan]
pin: PC6
max_power: 1.0
kick_start_time: 0.5

# FAN1 — hotend heatsink
[heater_fan hotend_fan]
pin: PC7
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

# FAN2 — controller
[controller_fan board_fan]
pin: PB15
heater: extruder, heater_bed
stepper: stepper_x, stepper_y, stepper_z
fan_speed: 1.0
idle_timeout: 120


# ==========================================
# MAINSAIL / MOONRAKER / SLICER SUPPORT
# ==========================================

[virtual_sdcard]
path: /srv/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

# also needed for adaptive meshing
[exclude_object]

# Firmware retraction: G10/G11 from the slicer, tunable live in Mainsail
# (SET_RETRACTION). Only used if OrcaSlicer has "Use firmware retraction" on.
# Bowden starting point; tune with a retraction test.
[firmware_retraction]
retract_length: 4.0
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 30

# Skew correction: no effect until a profile is calibrated and saved
# (SET_SKEW ... then SKEW_PROFILE SAVE=default and SAVE_CONFIG).
# START_PRINT loads the "default" profile automatically when it exists.
[skew_correction]

# Input shaper: needs an ADXL345. Wire it to the Klipper host (Raspberry Pi
# style SPI) or a spare MCU, uncomment, run SHAPER_CALIBRATE, SAVE_CONFIG,
# then raise max_accel in [printer].
#[mcu rpi]
#serial: /tmp/klipper_host_mcu
#[adxl345]
#cs_pin: rpi:None
#[resonance_tester]
#accel_chip: adxl345
#probe_points: 150, 150, 20
#[input_shaper]

# G2/G3 from OrcaSlicer arc fitting
[gcode_arcs]
resolution: 0.1

[respond]

