# ==========================================
# HYPERCUBE 300 V2 — MACROS
# Included from printer.cfg.
#
# OrcaSlicer machine start G-code:
#   START_PRINT BED_TEMP=[bed_temperature_initial_layer_single] EXTRUDER_TEMP=[nozzle_temperature_initial_layer]
# Optional: add SOAK=10 to heat-soak the bed for 10 minutes (large or ABS/ASA parts),
# and SMOOTH=1 to print the whole job in SMOOTH_MODE.
# OrcaSlicer machine end G-code:
#   END_PRINT
# Enable "Exclude objects" (label objects) in OrcaSlicer so the
# adaptive mesh knows where the parts are.
# ==========================================


# ==========================================
# HOMING
# Every G28 (Mainsail button, macros, slicer) goes through here.
# X/Y: sensorless at reduced current, with pauses so the stall flag
# clears between axes. Z: probe over the bed centre.
# ==========================================

[homing_override]
axes: xyz
set_position_z: 0
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    G90
    G91
    G1 Z5 F900                    ; lift before moving X/Y
    G90
    {% if home_all or 'X' in params %}
        _HOME_X
    {% endif %}
    {% if home_all or 'Y' in params %}
        _HOME_Y
    {% endif %}
    {% if home_all or 'Z' in params %}
        _HOME_Z
    {% endif %}

[gcode_macro _HOME_X]
gcode:
    {% set RUN_X = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
    {% set RUN_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current %}
    {% set HOME_CUR = 0.45 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
    G4 P2000
    G28 X
    G91
    G1 X5 F6000                   ; back off the frame
    G90
    M400
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_Y}

[gcode_macro _HOME_Y]
gcode:
    {% set RUN_X = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
    {% set RUN_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current %}
    {% set HOME_CUR = 0.45 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
    G4 P2000
    G28 Y
    G91
    G1 Y5 F6000
    G90
    M400
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_Y}

[gcode_macro _HOME_Z]
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        {action_raise_error("Home X and Y before Z")}
    {% endif %}
    {% set PROBE_X = printer.configfile.settings.probe.x_offset|float %}
    {% set PROBE_Y = printer.configfile.settings.probe.y_offset|float %}
    G90
    G1 X{150 - PROBE_X} Y{150 - PROBE_Y} F12000   ; probe over bed centre
    G28 Z
    G1 Z10 F900

# Kept so old habits and scripts still work.
[gcode_macro HOME]
description: Home all axes (same as G28)
gcode:
    G28


# ==========================================
# MOTION MODES
# SMOOTH_MODE: for a wobbly table, tall/thin parts or late-night prints.
# NORMAL_MODE: back to the printer.cfg limits.
# Both can be clicked in Mainsail mid-print.
# ==========================================

[gcode_macro SMOOTH_MODE]
description: Lower acceleration and corner speed to stop the frame shaking
gcode:
    SET_VELOCITY_LIMIT ACCEL=800 MINIMUM_CRUISE_RATIO=0.5 SQUARE_CORNER_VELOCITY=3
    RESPOND MSG="Smooth mode: accel 800, corner 3"

[gcode_macro NORMAL_MODE]
description: Restore the motion limits from printer.cfg
gcode:
    {% set cfg = printer.configfile.settings.printer %}
    SET_VELOCITY_LIMIT VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel} MINIMUM_CRUISE_RATIO={cfg.minimum_cruise_ratio} SQUARE_CORNER_VELOCITY={cfg.square_corner_velocity}
    RESPOND MSG="Normal mode restored"


# ==========================================
# PURGE LINE
# ==========================================

[gcode_macro PURGE_LINE]
description: Two-line priming purge at the front edge
gcode:
    {% set LENGTH = params.LENGTH|default(100)|float %}
    {% set AMOUNT = params.AMOUNT|default(3.5)|float %}
    SAVE_GCODE_STATE NAME=purge_state
    G90
    M83
    G92 E0
    G1 Z5 F1200
    G1 X20 Y15 F6000
    G1 Z0.28 F600
    G1 X{20 + LENGTH} Y15 E{AMOUNT} F900
    G1 Y17 F3000
    G1 X20 Y17 E{AMOUNT} F900
    G1 E-0.6 F1800
    G1 Z1 F1200
    G92 E0
    RESTORE_GCODE_STATE NAME=purge_state


# ==========================================
# START PRINT
# Heat bed (nozzle held at 150 °C so it does not ooze while probing),
# home, probe an adaptive mesh over the printed area, heat nozzle, purge.
# ==========================================

[gcode_macro START_PRINT]
description: Heat, home, adaptive mesh, purge
gcode:
    {% set BED = params.BED_TEMP|default(0)|float %}
    {% set HOTEND = params.EXTRUDER_TEMP|default(0)|float %}
    {% set SOAK = params.SOAK|default(0)|int %}
    {% set SMOOTH = params.SMOOTH|default(0)|int %}
    {% if BED <= 0 or HOTEND <= 0 %}
        {action_raise_error("START_PRINT needs BED_TEMP and EXTRUDER_TEMP")}
    {% endif %}
    G90
    M83
    M140 S{BED}
    M104 S150
    M190 S{BED}
    {% if SOAK > 0 %}
        RESPOND MSG="Heat soak: {SOAK} min"
        G4 P{SOAK * 60000}
    {% endif %}
    G28
    BED_MESH_CALIBRATE ADAPTIVE=1
    {% if 'skew_correction default' in printer.configfile.settings %}
        SKEW_PROFILE LOAD=default
    {% endif %}
    G1 Z10 F900
    {% if SMOOTH %}
        SMOOTH_MODE
    {% else %}
        NORMAL_MODE
    {% endif %}
    M109 S{HOTEND}
    G92 E0
    PURGE_LINE


# ==========================================
# END PRINT
# ==========================================

[gcode_macro END_PRINT]
description: Retract, park, disable heaters and motors
gcode:
    {% set HOMED = printer.toolhead.homed_axes %}
    {% set ZMAX = printer.toolhead.axis_maximum.z|float %}
    {% set ZPOS = printer.toolhead.position.z|float %}
    {% set LIFT = [10.0, [0.0, ZMAX - ZPOS]|max]|min %}
    M400
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-2 F1800
    {% endif %}
    TURN_OFF_HEATERS
    M107
    {% if 'xyz' in HOMED %}
        {% if LIFT > 0 %}
            G91
            G1 Z{LIFT} F300
        {% endif %}
        G90
        G1 X10 Y290 F6000
    {% endif %}
    SET_SKEW CLEAR=1
    G90
    M84


# ==========================================
# PAUSE / RESUME / CANCEL
# PAUSE retracts, lifts and parks so the nozzle does not ooze onto
# the part. RESUME_BASE returns to the saved position before printing.
# ==========================================

[gcode_macro PAUSE]
description: Pause, retract, lift and park
rename_existing: PAUSE_BASE
gcode:
    {% if printer.pause_resume.is_paused %}
        RESPOND MSG="Already paused"
    {% else %}
        {% set ZMAX = printer.toolhead.axis_maximum.z|float %}
        {% set ZPOS = printer.toolhead.position.z|float %}
        {% set LIFT = [10.0, [0.0, ZMAX - ZPOS]|max]|min %}
        PAUSE_BASE
        G91
        {% if printer.extruder.can_extrude %}
            G1 E-1 F2100
        {% endif %}
        {% if LIFT > 0 %}
            G1 Z{LIFT} F900
        {% endif %}
        G90
        {% if 'xy' in printer.toolhead.homed_axes %}
            G1 X10 Y290 F6000
        {% endif %}
    {% endif %}

[gcode_macro RESUME]
description: Unretract and resume
rename_existing: RESUME_BASE
gcode:
    {% if not printer.pause_resume.is_paused %}
        RESPOND MSG="Not paused"
    {% else %}
        {% if printer.extruder.can_extrude %}
            M83
            G1 E1 F2100
        {% else %}
            RESPOND TYPE=error MSG="Nozzle too cold to unretract"
        {% endif %}
        RESUME_BASE {rawparams}
    {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel, park and cool down
rename_existing: CANCEL_PRINT_BASE
gcode:
    END_PRINT
    CLEAR_PAUSE
    CANCEL_PRINT_BASE


# ==========================================
# FILAMENT
# Bowden: BOWDEN is the tube length from extruder gears to the nozzle.
# Measure yours and change the default (moves are split into 90 mm
# steps to stay under max_extrude_only_distance).
# ==========================================

[gcode_macro _FEED]
gcode:
    {% set DIST = params.DIST|float %}
    {% set SPEED = params.SPEED|default(1500)|float %}
    {% set STEPS = (DIST|abs / 90)|round(0, 'ceil')|int %}
    M83
    {% for _ in range(STEPS) %}
        G1 E{DIST / STEPS} F{SPEED}
    {% endfor %}

[gcode_macro LOAD_FILAMENT]
description: Heat, feed through the Bowden tube and purge
gcode:
    {% set TEMP = params.TEMP|default(240)|float %}
    {% set BOWDEN = params.BOWDEN|default(450)|float %}
    SAVE_GCODE_STATE NAME=load_state
    M109 S{TEMP}
    _FEED DIST={BOWDEN - 30} SPEED=3000
    _FEED DIST=30 SPEED=300
    _FEED DIST=40 SPEED=200
    M400
    RESTORE_GCODE_STATE NAME=load_state
    RESPOND MSG="Filament loaded"

[gcode_macro UNLOAD_FILAMENT]
description: Heat, form a clean tip and pull filament out of the Bowden tube
gcode:
    {% set TEMP = params.TEMP|default(240)|float %}
    {% set BOWDEN = params.BOWDEN|default(450)|float %}
    SAVE_GCODE_STATE NAME=unload_state
    M109 S{TEMP}
    _FEED DIST=10 SPEED=300
    _FEED DIST=-15 SPEED=3000
    _FEED DIST={-(BOWDEN + 20)} SPEED=3000
    M400
    RESTORE_GCODE_STATE NAME=unload_state
    RESPOND MSG="Filament unloaded"

# Filament change from the slicer (colour change at a layer).
# Pauses and parks; unload/load from Mainsail, then Resume.
[gcode_macro M600]
description: Filament change
gcode:
    PAUSE
    RESPOND MSG="Filament change: run UNLOAD_FILAMENT, LOAD_FILAMENT, then RESUME"
