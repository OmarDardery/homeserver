name: Nix checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: bash -n install.sh && bash -n connect.sh && bash -n klipper-deploy.sh
      - run: python3 -m json.tool cloudflare/ingress.json > /dev/null
      - run: python3 -m json.tool secrets/cockpit/manifest.json > /dev/null && python3 -m py_compile secrets/backend.py && node --check secrets/cockpit/index.js
      - run: nix shell nixpkgs#sops nixpkgs#age nixpkgs#python3 -c python3 secrets/test_backend.py
      - name: Verify committed secret file is ciphertext (if present)
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'secrets')
          import backend
          p = Path('secrets/runtime.enc')
          if p.exists():
              backend.encrypted_document(p.read_bytes())
          PY
      - name: Require a committed and current lock file
        run: |
          git ls-files --error-unmatch flake.lock
          nix flake check --no-build --no-update-lock-file
      - run: nix eval --no-update-lock-file --raw .#nixosConfigurations.test.config.system.build.toplevel.drvPath
      - run: nix build --no-update-lock-file .#packages.x86_64-linux.default
      - name: Validate Compose structure with dummy credentials
        run: |
          sudo mkdir -p /run/homeserver-secrets
          sudo cp aiostreams.env.example /run/homeserver-secrets/aiostreams.env
          sudo chmod 600 /run/homeserver-secrets/*.env
          sudo docker compose -f compose.yaml config --quiet
