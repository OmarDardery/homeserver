name: Nix checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: bash -n install.sh
      - run: nix flake check --no-build
      - run: nix eval --raw .#nixosConfigurations.test.config.system.build.toplevel.drvPath
      - run: nix build .#packages.x86_64-linux.default
      - name: Validate Compose structure with dummy credentials
        run: |
          sudo mkdir -p /var/lib/homeserver/aiostreams
          sudo cp aiostreams.env.example /var/lib/homeserver/aiostreams/aiostreams.env
          sudo chmod 600 /var/lib/homeserver/aiostreams/*.env
          sudo docker compose -f compose.yaml config --quiet
